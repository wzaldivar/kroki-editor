name: Publish latest (fork)

# Fork-only publishing, kept on the `releases` branch so `main` can stay identical
# to upstream. Every push to `releases` builds the multi-arch image, pushes it to this
# repo's own GHCR package as :<YYYYMMDDHHmmSS> (UTC time of the commit) + :latest,
# then tags the commit and creates a GitHub Release with the same version. No RC, no
# changelog, no commit back to the repo. This is a new file on purpose: upstream's
# workflows are left untouched so merging `main` into `releases` never conflicts.
#
# The Release is created with GITHUB_TOKEN, which never triggers other workflows, so
# upstream's release-driven pre-release / docker-publish / pages workflows stay dormant.
on:
  push:
    branches: [releases]

permissions:
  contents: write
  packages: write

concurrency:
  group: publish-latest
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Commit time, not build time: re-running the job on the same commit
      # re-pushes the same version instead of minting a new one.
      - name: Resolve version (UTC commit timestamp)
        id: v
        run: echo "ver=$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push :<version> + :latest
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.v.outputs.ver }}
            ghcr.io/${{ github.repository }}:latest
          labels: |
            org.opencontainers.image.version=${{ steps.v.outputs.ver }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Bare timestamp tag (no leading v) so it never mixes with upstream's v* tags.
      # Skipped when the release already exists, so re-running the job is safe.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.v.outputs.ver }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          if gh release view "$VER" >/dev/null 2>&1; then
            echo "Release $VER already exists — skipping."
            exit 0
          fi
          printf '## Image\n\n```\ndocker pull %s:%s\n```\n' "$IMAGE" "$VER" > .notes.md
          gh release create "$VER" --target "$GITHUB_SHA" --title "$VER" \
            --notes-file .notes.md --generate-notes --latest
